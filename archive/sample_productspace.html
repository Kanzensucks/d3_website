<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trauma Space — states by crash-composition similarity</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root{ --bg:#04060c; --ink:#e6eefb; --mut:#7c8aa3; --cyan:#46d3ff; }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);
      font-family:"Inter","Segoe UI",sans-serif;padding:22px;
      background-image:radial-gradient(circle at 50% 25%, #0a1426 0%, #04060c 70%);}
    h1{font-size:1.35rem;margin:0 0 2px;letter-spacing:.03em}
    h1 .t{color:var(--cyan)}
    .sub{color:var(--mut);font-size:.86rem;margin:0 0 12px;max-width:84ch}
    .bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#0a1018;
      border:1px solid #16233b;border-radius:10px;padding:9px 14px;margin-bottom:12px}
    .play{background:var(--cyan);color:#04121b;border:0;border-radius:8px;padding:8px 15px;font-weight:800;cursor:pointer}
    #yr{flex:1;min-width:160px;accent-color:var(--cyan)}
    .yrnum{font-size:1.4rem;font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums}
    .seg{display:inline-flex;border:1px solid #16233b;border-radius:999px;overflow:hidden}
    .seg button{background:transparent;color:var(--mut);border:0;padding:7px 13px;font-weight:700;font-size:.8rem;cursor:pointer}
    .seg button.on{background:var(--cyan);color:#04121b}
    .stage{position:relative;border:1px solid #16233b;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 80px rgba(0,0,0,.7)}
    canvas{display:block;width:100%;height:auto;cursor:grab}
    canvas:active{cursor:grabbing}
    .legend{position:absolute;left:16px;bottom:14px;font-size:.74rem;color:var(--mut);
      background:rgba(4,6,12,.6);border:1px solid #16233b;border-radius:8px;padding:8px 10px}
    .legend b{color:var(--ink)}
    .tip{position:fixed;pointer-events:none;background:#04121b;border:1px solid var(--cyan);
      border-radius:8px;padding:8px 11px;font-size:.8rem;color:#eaf6ff;z-index:9;display:none;
      box-shadow:0 6px 22px rgba(0,0,0,.6);max-width:240px}
    .tip b{color:var(--cyan)}
  </style>
</head>
<body>
  <h1>◢ TRAUMA <span class="t">SPACE</span> — states by crash-composition similarity</h1>
  <p class="sub">Each orb is a state; <b>size &amp; colour = that year's hospitalisation rate</b>. States whose
    road-user / age / sex crash mix is alike are linked and pull together. Press play to watch the decade — NT swells into the red sun.</p>

  <div class="bar">
    <button class="play" id="play">▶ PLAY</button>
    <input type="range" id="yr" min="2011" max="2021" step="1" value="2011" />
    <span class="yrnum" id="yrnum">2011</span>
    <span class="seg" id="spin"><button data-s="1" class="on">Auto-spin</button><button data-s="0">Hold</button></span>
  </div>

  <div class="stage">
    <canvas id="cv" width="900" height="600"></canvas>
    <div class="legend" id="legend"></div>
  </div>
  <div class="tip" id="tip"></div>

<script>
const CODES=["NSW","Vic","Qld","SA","WA","Tas","NT","ACT"];
const FULL={NSW:"New South Wales",Vic:"Victoria",Qld:"Queensland",SA:"South Australia",
  WA:"Western Australia",Tas:"Tasmania",NT:"Northern Territory",ACT:"Australian Capital Territory"};

Promise.all([
  d3.csv("data/state_year_per100k.csv",d=>({year:+d.Year,state:d.state,cases:+d.cases,pop:+d.population,rate:+d.cases_per_100k})),
  d3.csv("data/state_year_roaduser.csv",d=>({year:+d.year,cat:d.road_user,state:d.state,cases:+d.cases})),
  d3.csv("data/state_year_age.csv",d=>({year:+d.year,cat:d.age_group,state:d.state,cases:+d.cases})),
  d3.csv("data/state_year_sex.csv",d=>({year:+d.year,cat:d.sex,state:d.state,cases:+d.cases})),
]).then(([tot,ru,age,sex])=>{
  const T=new Map(); tot.forEach(r=>T.set(r.state+"|"+r.year,r));
  const rate=(s,y)=>T.get(s+"|"+y).rate;
  const natAvg=y=>{let c=0,p=0;CODES.forEach(s=>{const t=T.get(s+"|"+y);c+=t.cases;p+=t.pop;});return c/p*1e5;};
  const decCases={};CODES.forEach(c=>{let cs=0;for(let y=2011;y<=2021;y++)cs+=T.get(c+"|"+y).cases;decCases[c]=cs;});

  function decShares(rows,order,addRem,remName){
    const cats=order?order.slice():[...new Set(rows.map(r=>r.cat))];
    const sum={};CODES.forEach(c=>sum[c]={});
    rows.forEach(r=>{sum[r.state][r.cat]=(sum[r.state][r.cat]||0)+r.cases;});
    if(addRem){CODES.forEach(c=>{let k=0;Object.values(sum[c]).forEach(v=>k+=v);sum[c][remName]=Math.max(0,decCases[c]-k);});
      if(!cats.includes(remName))cats.unshift(remName);}
    const shares={};CODES.forEach(c=>{const t2=d3.sum(cats,k=>sum[c][k]||0)||1;shares[c]=cats.map(k=>(sum[c][k]||0)/t2);});
    return {cats,shares};
  }
  const RU=decShares(ru,["Motorcyclist","Pedal cyclist","Pedestrian","Bus occupant","Other or unknown"],true,"Vehicle occupant");
  const AG=decShares(age,[...new Set(age.map(r=>r.cat))].sort((a,b)=>parseInt(a)-parseInt(b)));
  const SX=decShares(sex,["Male","Female"]);
  const profile={};CODES.forEach(c=>profile[c]=[...RU.shares[c],...AG.shares[c],...SX.shares[c]]);
  const ci=RU.cats.indexOf("Pedal cyclist"),pi=RU.cats.indexOf("Pedestrian");
  const urban={};CODES.forEach(c=>urban[c]=RU.shares[c][ci]+RU.shares[c][pi]);

  function cos(a,b){let d=0,na=0,nb=0;for(let i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}return d/(Math.sqrt(na)*Math.sqrt(nb));}
  const eset=new Set(),links=[];
  CODES.forEach(c=>{CODES.filter(o=>o!==c).map(o=>({o,s:cos(profile[c],profile[o])})).sort((a,b)=>b.s-a.s).slice(0,3)
    .forEach(({o,s})=>{const k=[c,o].sort().join("-");if(!eset.has(k)){eset.add(k);links.push({source:c,target:o,sim:s});}});});
  const nodes=CODES.map(c=>({id:c,urban:urban[c]}));

  const rateExt=d3.extent(tot,r=>r.rate);
  const norm=v=>(v-rateExt[0])/(rateExt[1]-rateExt[0]);
  const rOf=d3.scaleSqrt().domain(rateExt).range([10,40]);
  const colOf=v=>d3.interpolateYlOrRd(0.12+0.82*norm(v));
  const zOf=d3.scaleLinear().domain(d3.extent(nodes,n=>n.urban)).range([-170,170]);

  const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
  const W=cv.width,H=cv.height,cx=W/2,cy=H/2+10,focal=820;
  let rot=-0.4,hoverId=null,year=2011,spin=true;

  const sim=d3.forceSimulation(nodes)
    .force("link",d3.forceLink(links).id(d=>d.id).distance(d=>70+(1-d.sim)*560).strength(d=>0.25+d.sim*0.5))
    .force("charge",d3.forceManyBody().strength(-300))
    .force("collide",d3.forceCollide(40))
    .force("center",d3.forceCenter(cx,cy)).stop();
  for(let i=0;i<400;i++)sim.tick();
  nodes.forEach(n=>{n.X=n.x-cx;n.Y=n.y-cy;n.Z=zOf(n.urban);});

  // starfield
  const stars=d3.range(150).map(()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+0.2,a:Math.random()*0.5+0.1}));

  function project(n){const c=Math.cos(rot),s=Math.sin(rot);const X=n.X*c+n.Z*s,Z=-n.X*s+n.Z*c;
    const p=focal/(focal-Z);return {sx:cx+X*p,sy:cy+n.Y*p,depth:Z,p};}

  function render(){
    ctx.fillStyle="#04060c";ctx.fillRect(0,0,W,H);
    ctx.save();ctx.globalCompositeOperation="lighter";
    stars.forEach(s=>{ctx.globalAlpha=s.a;ctx.fillStyle="#9fc6ff";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();});
    ctx.restore();
    const P={};nodes.forEach(n=>P[n.id]=project(n));
    ctx.globalCompositeOperation="lighter";
    links.forEach(l=>{const a=P[l.source.id],b=P[l.target.id];
      const hl=hoverId&&(l.source.id===hoverId||l.target.id===hoverId);
      ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);
      ctx.strokeStyle=`rgba(70,150,210,${(hl?0.6:0.14)*Math.min(a.p,b.p)})`;
      ctx.lineWidth=(hl?2.4:0.9)*((l.sim-0.8)/0.2+0.4);ctx.stroke();});
    const ord=nodes.slice().sort((m,n)=>P[m.id].depth-P[n.id].depth);
    ord.forEach(n=>{const pr=P[n.id],rt=rate(n.id,year),r=rOf(rt)*pr.p,col=colOf(rt);
      const dim=hoverId&&hoverId!==n.id?0.4:1;
      const rgb=d3.color(col);
      const g=ctx.createRadialGradient(pr.sx,pr.sy,0,pr.sx,pr.sy,r*2.8);
      g.addColorStop(0,`rgba(${rgb.r},${rgb.g},${rgb.b},${0.95*dim})`);
      g.addColorStop(0.45,`rgba(${rgb.r},${rgb.g},${rgb.b},${0.28*dim})`);
      g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(pr.sx,pr.sy,r*2.8,0,7);ctx.fill();
      ctx.globalAlpha=dim;ctx.fillStyle=col;ctx.beginPath();ctx.arc(pr.sx,pr.sy,r,0,7);ctx.fill();ctx.globalAlpha=1;});
    ctx.globalCompositeOperation="source-over";
    ord.reverse().forEach(n=>{const pr=P[n.id],rt=rate(n.id,year),r=rOf(rt)*pr.p;
      ctx.globalAlpha=hoverId&&hoverId!==n.id?0.4:1;
      ctx.fillStyle="#eef5ff";ctx.font=`700 ${Math.round(12*pr.p)}px Inter,sans-serif`;ctx.textAlign="center";
      ctx.fillText(n.id,pr.sx,pr.sy-r-6);ctx.globalAlpha=1;});
    // HUD
    const nt=rate("NT",year),mult=(nt/natAvg(year)).toFixed(2);
    ctx.textAlign="left";ctx.fillStyle="rgba(230,238,251,.9)";ctx.font="800 30px Inter,sans-serif";ctx.fillText(year,24,46);
    ctx.fillStyle="#ff6a5a";ctx.font="800 16px Inter,sans-serif";ctx.fillText(`NT = ${mult}× national average`,24,70);
    cv._P=P;
  }

  // auto-rotate (smooth, live). Preview throttles rAF; that's fine.
  d3.timer(()=>{ if(spin&&!hoverId) rot+=0.0016; render(); });
  render();

  d3.select(cv).call(d3.drag().on("drag",e=>{rot+=e.dx*0.008;render();}));
  const tip=document.getElementById("tip");
  cv.addEventListener("mousemove",e=>{
    const rect=cv.getBoundingClientRect(),sxr=W/rect.width,syr=H/rect.height;
    const mx=(e.clientX-rect.left)*sxr,my=(e.clientY-rect.top)*syr;
    let best=null,bd=1e9;const P=cv._P||{};
    nodes.forEach(n=>{const pr=P[n.id];const d=Math.hypot(pr.sx-mx,pr.sy-my);const r=rOf(rate(n.id,year))*pr.p;if(d<r+6&&d<bd){bd=d;best=n;}});
    const nh=best?best.id:null;if(nh!==hoverId){hoverId=nh;render();}
    if(best){const ls=links.filter(l=>l.source.id===best.id||l.target.id===best.id).map(l=>l.source.id===best.id?l.target.id:l.source.id);
      tip.style.display="block";tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY+14)+"px";
      tip.innerHTML=`<b>${FULL[best.id]}</b> · ${year}<br>${rate(best.id,year).toFixed(1)} /100k<br>
        <span style="color:#9fb3cc">most similar to:</span> ${ls.join(", ")}`;
    } else tip.style.display="none";
  });
  cv.addEventListener("mouseleave",()=>{tip.style.display="none";if(hoverId){hoverId=null;}});

  // controls
  const slider=document.getElementById("yr"),num=document.getElementById("yrnum"),play=document.getElementById("play");
  let timer=null;
  function setYear(y){year=y;slider.value=y;num.textContent=y;render();}
  slider.addEventListener("input",e=>{stopP();setYear(+e.target.value);});
  play.addEventListener("click",()=>timer?stopP():startP());
  function startP(){play.textContent="❚❚ PAUSE";if(year>=2021)setYear(2011);timer=d3.interval(()=>setYear(year>=2021?2011:year+1),1100);}
  function stopP(){play.textContent="▶ PLAY";if(timer){timer.stop();timer=null;}}
  document.querySelectorAll("#spin button").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll("#spin button").forEach(x=>x.classList.remove("on"));b.classList.add("on");spin=b.dataset.s==="1";}));

  document.getElementById("legend").innerHTML=`<b>Orb size &amp; colour</b> = rate /100k &nbsp;·&nbsp; <b>links</b> = similar crash mix &nbsp;·&nbsp; drag / hover`;
  setYear(2011);
});
</script>
</body>
</html>
